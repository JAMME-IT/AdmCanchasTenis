name: CI

# Runs on Linux for every push and PR, catching issues that only
# reproduce on Windows before they reach main.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # prisma generate does not connect to a database; the dummy URL only
      # satisfies prisma.config.ts, which reads DIRECT_URL for CLI commands.
      - run: npm run db:generate --workspace=api
        env:
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      - run: npm run build
